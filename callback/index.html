<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Tesla sign-in</title>
<style>
  :root { --bg: #f6f6f4; --card: #ffffff; --ink: #18181b; --muted: #6b6b73; --line: #e2e2e0; --accent: #c8102e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1b1b1f; --ink: #ededf0; --muted: #9a9aa3; --line: #2c2c33; --accent: #ff4d5e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 Inter, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line);
         border-radius: 14px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  textarea { width: 100%; height: 96px; resize: none; padding: 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink);
             font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
           background: var(--accent); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; }
  .error { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">Signed in to Tesla</h1>
  <p id="lead">Copy this address and paste it into the terminal that asked for it. It works once and expires within minutes.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy" type="button">Copy</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const box = document.getElementById("url");
  if (params.get("error")) {
    document.getElementById("title").textContent = "Sign-in did not finish";
    const lead = document.getElementById("lead");
    lead.className = "error";
    lead.textContent = params.get("error") + (params.get("error_description") ? ": " + params.get("error_description") : "");
    box.hidden = true;
    document.getElementById("copy").hidden = true;
  } else if (!params.get("code")) {
    document.getElementById("title").textContent = "Nothing to copy";
    document.getElementById("lead").textContent = "This page receives the Tesla sign-in result. Start the sign-in from the terminal.";
    box.hidden = true;
    document.getElementById("copy").hidden = true;
  } else {
    box.value = location.href;
    box.addEventListener("focus", () => box.select());
    document.getElementById("copy").addEventListener("click", async () => {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
      document.getElementById("copy").textContent = "Copied";
    });
  }
</script>
</body>
</html>
