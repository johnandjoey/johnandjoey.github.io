<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tesla Fleet API key</title>
<style>
  :root { --bg: #f6f6f4; --ink: #18181b; --muted: #6b6b73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --ink: #ededf0; --muted: #9a9aa3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 Inter, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; }
  p { color: var(--muted); }
  code { font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Personal Tesla Fleet API app</h1>
  <p>This site holds the public key for a private app that talks to its owner's own car.</p>
  <p><code>/.well-known/appspecific/com.tesla.3p.public-key.pem</code></p>
</main>
</body>
</html>
